name: 🚀 Main CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infra/**"
      - "lambdas/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ================================
  # CHANGE DETECTION - Compare against last deployment tag
  # ================================
  detect-changes:
    name: 🔍 Smart Change Detection
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.changes.outputs.infrastructure || steps.initial-changes.outputs.infrastructure }}
      api: ${{ steps.changes.outputs.api || steps.initial-changes.outputs.api }}
      auth_lambdas: ${{ steps.changes.outputs.auth_lambdas || steps.initial-changes.outputs.auth_lambdas }}
      murder_crow: ${{ steps.changes.outputs.murder_crow || steps.initial-changes.outputs.murder_crow }}
      docs_only: ${{ steps.changes.outputs.docs_only || steps.initial-changes.outputs.docs_only }}
      any_code: ${{ steps.check.outputs.any_code }}
      last_deploy_tag: ${{ steps.find-tag.outputs.tag }}
      changes_since_deploy: ${{ steps.find-tag.outputs.has_changes }}
      is_initial: ${{ steps.find-tag.outputs.is_initial }}
    steps:
      - name: 📥 Checkout with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history needed for tag comparison

      - name: 🔍 Find Last Deployment Tag
        id: find-tag
        run: |
          # Find the most recent deployment tag
          LAST_TAG=$(git tag --list "deploy-*" --sort=-version:refname | head -n1)

          if [ -z "$LAST_TAG" ]; then
            echo "⚠️  No previous deployment tag found - treating as initial deployment"
            echo "tag=" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "is_initial=true" >> $GITHUB_OUTPUT
            echo "compare_ref=" >> $GITHUB_OUTPUT
          else
            echo "📍 Last deployment tag: $LAST_TAG"
            echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "is_initial=false" >> $GITHUB_OUTPUT

            # Check if there are any changes since last deployment
            CHANGES=$(git rev-list $LAST_TAG..HEAD --count)
            if [ "$CHANGES" -eq 0 ]; then
              echo "✅ No changes since last deployment"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "📝 $CHANGES commits since last deployment"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
            echo "compare_ref=$LAST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Detect Changes Since Last Deployment
        id: changes
        if: steps.find-tag.outputs.has_changes == 'true' && steps.find-tag.outputs.is_initial == 'false'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.find-tag.outputs.compare_ref }}
          filters: |
            infrastructure:
              - 'infra/**'
              - '.github/workflows/main-pipeline*.yml'
              - '.github/workflows/infrastructure-only.yml'
            api:
              - 'apps/api/**'
            auth_lambdas:
              - 'lambdas/auth-**/**'
              - 'lambdas/custom-email-sender/**'
            murder_crow:
              - 'lambdas/murder/**'
              - 'lambdas/worker/**'
            docs_only:
              - 'docs/**'
              - '*.md'
              - '.gitignore'

      - name: 🔍 Handle Initial Deployment (No Previous Tags)
        id: initial-changes
        if: steps.find-tag.outputs.is_initial == 'true'
        run: |
          echo "🎯 Initial deployment - treating infrastructure as changed"
          echo "infrastructure=true" >> $GITHUB_OUTPUT
          echo "api=false" >> $GITHUB_OUTPUT
          echo "auth_lambdas=false" >> $GITHUB_OUTPUT
          echo "murder_crow=false" >> $GITHUB_OUTPUT
          echo "docs_only=false" >> $GITHUB_OUTPUT

      - name: ✅ Check Any Code Changes
        id: check
        run: |
          if [[ "${{ steps.find-tag.outputs.has_changes }}" == "false" ]]; then
            echo "any_code=false" >> $GITHUB_OUTPUT
            echo "::notice::⏸️  No changes since last deployment - skipping pipeline"
          elif [[ "${{ steps.find-tag.outputs.is_initial }}" == "true" ]]; then
            echo "any_code=true" >> $GITHUB_OUTPUT
            echo "::notice::🎯 Initial deployment - deploying infrastructure"
          elif [[ "${{ steps.changes.outputs.infrastructure }}" == "true" ||
                  "${{ steps.changes.outputs.api }}" == "true" ||
                  "${{ steps.changes.outputs.auth_lambdas }}" == "true" ||
                  "${{ steps.changes.outputs.murder_crow }}" == "true" ]]; then
            echo "any_code=true" >> $GITHUB_OUTPUT
            echo "::notice::📝 Code changes detected since last deployment"
          else
            echo "any_code=false" >> $GITHUB_OUTPUT
            echo "::notice::📚 Only documentation changes since last deployment"
          fi

      - name: 📋 Change Summary Since Last Deployment
        run: |
          echo "## 🔍 Change Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed Since Last Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Infrastructure | ${{ steps.changes.outputs.infrastructure || steps.initial-changes.outputs.infrastructure || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 API | ${{ steps.changes.outputs.api || steps.initial-changes.outputs.api || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Auth Lambdas | ${{ steps.changes.outputs.auth_lambdas || steps.initial-changes.outputs.auth_lambdas || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Murder/Crow | ${{ steps.changes.outputs.murder_crow || steps.initial-changes.outputs.murder_crow || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 Docs Only | ${{ steps.changes.outputs.docs_only || steps.initial-changes.outputs.docs_only || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Last Deployment:** ${{ steps.find-tag.outputs.tag || 'None (initial)' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Since:** ${{ steps.find-tag.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "**Is Initial:** ${{ steps.find-tag.outputs.is_initial }}" >> $GITHUB_STEP_SUMMARY

  # ================================
  # QUALITY CHECKS
  # ================================
  python-quality:
    name: 🐍 Python Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install API Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: 🧪 Run Quality Checks
        working-directory: apps/api
        run: |
          mypy src --strict --show-error-codes
          black src tests --check --line-length=88
          flake8 src --max-line-length=88 --max-complexity=10
          pytest --cov=src --cov-report=term-missing --cov-fail-under=75

  typescript-quality:
    name: ⚡ TypeScript Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run type-check:all
      - run: npm run quality:typescript
      - run: npm run format:check

  # ================================
  # SMART DEPLOYMENT
  # ================================
  deploy-smart:
    name: 🚀 Smart Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, python-quality]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.any_code == 'true'
    environment: development
    outputs:
      deployment_type: ${{ steps.deploy.outputs.type }}
      deployment_time: ${{ steps.deploy.outputs.time }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: ⚙️ Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🚀 Smart Deployment Logic
        id: deploy
        run: |
          START_TIME=$(date +%s)

          echo "## 🚀 Smart Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "**Changes since last deployment tag:** ${{ needs.detect-changes.outputs.last_deploy_tag || 'initial' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.detect-changes.outputs.infrastructure }}" == "true" ]]; then
            echo "🏗️ **Infrastructure changes detected - Full deployment**" >> $GITHUB_STEP_SUMMARY
            echo "type=infrastructure" >> $GITHUB_OUTPUT

            # Full infrastructure deployment
            echo "Installing dependencies..."
            npm ci
            cd apps/api
            python -m pip install --upgrade pip
            pip install -e .[dev]
            make build-lambda || echo "Build completed"
            cd ../../infra
            npm ci
            npx cdk deploy --all --context stage=dev --require-approval never
            echo "✅ Infrastructure deployment completed" >> $GITHUB_STEP_SUMMARY

          elif [[ "${{ needs.detect-changes.outputs.api }}" == "true" ]]; then
            echo "⚡ **API changes detected - Fast Lambda deployment**" >> $GITHUB_STEP_SUMMARY
            echo "type=api" >> $GITHUB_OUTPUT

            # Fast API deployment
            cd apps/api
            python -m pip install --upgrade pip
            pip install -e .[dev]
            make build-lambda
            # Zip the dist directory for Lambda upload
            cd dist && zip -r ../lambda-deployment.zip . && cd ..
            # Update Lambda function directly
            aws lambda update-function-code \
              --function-name cawnex-api-dev \
              --zip-file fileb://lambda-deployment.zip
            echo "✅ Fast API deployment completed" >> $GITHUB_STEP_SUMMARY

          elif [[ "${{ needs.detect-changes.outputs.auth_lambdas }}" == "true" ]]; then
            echo "🔐 **Auth Lambda changes detected - Fast auth deployment**" >> $GITHUB_STEP_SUMMARY
            echo "type=auth" >> $GITHUB_OUTPUT

            # Fast auth deployment logic
            echo "✅ Auth deployment logic would go here" >> $GITHUB_STEP_SUMMARY

          elif [[ "${{ needs.detect-changes.outputs.murder_crow }}" == "true" ]]; then
            echo "🤖 **Murder/Crow changes detected - Fast AI system deployment**" >> $GITHUB_STEP_SUMMARY
            echo "type=murder_crow" >> $GITHUB_OUTPUT

            # Fast Murder/Crow deployment logic
            echo "✅ Murder/Crow deployment logic would go here" >> $GITHUB_STEP_SUMMARY

          else
            echo "🎯 **Component-specific deployment**" >> $GITHUB_STEP_SUMMARY
            echo "type=other" >> $GITHUB_OUTPUT
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "time=${DURATION}" >> $GITHUB_OUTPUT
          echo "⏱️ **Deployment time:** ${DURATION} seconds" >> $GITHUB_STEP_SUMMARY

  # ================================
  # TAG SUCCESSFUL DEPLOYMENT
  # ================================
  tag-deployment:
    name: 🏷️ Tag Successful Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-smart]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      success() &&
      needs.detect-changes.outputs.any_code == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Create Deployment Tag
        run: |
          # Create deployment tag with timestamp and deployment info
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          TAG_NAME="deploy-${TIMESTAMP}"

          echo "Creating deployment tag: $TAG_NAME"

          # Create annotated tag with deployment metadata
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG_MESSAGE="Deployment: ${{ needs.deploy-smart.outputs.deployment_type }}

          Deployed at: $(date -u)
          Deployment type: ${{ needs.deploy-smart.outputs.deployment_type }}
          Duration: ${{ needs.deploy-smart.outputs.deployment_time }}s
          Commit: ${{ github.sha }}

          Changes deployed:
          - Infrastructure: ${{ needs.detect-changes.outputs.infrastructure }}
          - API: ${{ needs.detect-changes.outputs.api }}
          - Auth Lambdas: ${{ needs.detect-changes.outputs.auth_lambdas }}
          - Murder/Crow: ${{ needs.detect-changes.outputs.murder_crow }}

          Previous tag: ${{ needs.detect-changes.outputs.last_deploy_tag || 'none' }}"

          git tag -a "$TAG_NAME" -m "$TAG_MESSAGE"
          git push origin "$TAG_NAME"

          echo "✅ Created deployment tag: $TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Tag:** $TAG_NAME" >> $GITHUB_STEP_SUMMARY

  # ================================
  # SUMMARY
  # ================================
  summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-smart, tag-deployment]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: 📊 Final Summary
        run: |
          echo "## 📊 Smart Deployment Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📍 Last Deploy Tag | ${{ needs.detect-changes.outputs.last_deploy_tag || 'initial' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔄 Changes Since | ${{ needs.detect-changes.outputs.changes_since_deploy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deployment Type | ${{ needs.deploy-smart.outputs.deployment_type || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Deploy Time | ${{ needs.deploy-smart.outputs.deployment_time || 'n/a' }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ New Tag | ${{ needs.tag-deployment.result == 'success' && 'Created' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.detect-changes.outputs.any_code }}" == "false" ]]; then
            if [[ "${{ needs.detect-changes.outputs.changes_since_deploy }}" == "false" ]]; then
              echo "⏸️ **No changes since last deployment - Pipeline skipped**" >> $GITHUB_STEP_SUMMARY
            else
              echo "📚 **Documentation-only changes - Deployment skipped**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✅ **Deployment completed and tagged for future change detection**" >> $GITHUB_STEP_SUMMARY
          fi
