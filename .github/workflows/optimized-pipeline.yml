name: ⚡ Optimized CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infra/**"
      - "lambdas/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_infrastructure:
        description: "Force infrastructure deployment"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ================================
  # CHANGE DETECTION - Determines what needs deployment
  # ================================
  detect-changes:
    name: 🔍 Smart Change Detection
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      api: ${{ steps.changes.outputs.api }}
      ios: ${{ steps.changes.outputs.ios }}
      auth_lambdas: ${{ steps.changes.outputs.auth_lambdas }}
      murder_crow: ${{ steps.changes.outputs.murder_crow }}
      email_templates: ${{ steps.changes.outputs.email_templates }}
      scripts: ${{ steps.changes.outputs.scripts }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      any_code: ${{ steps.any-code.outputs.result }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2 # Need previous commit for accurate diff

      - name: 🔍 Detect Changed Paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infrastructure:
              - 'infra/**'
              - '.github/workflows/optimized-pipeline.yml'
              - '.github/workflows/main-pipeline.yml'
            api:
              - 'apps/api/**'
            ios:
              - 'apps/ios/**'
            auth_lambdas:
              - 'lambdas/auth-**/**'
              - 'lambdas/custom-email-sender/**'
            murder_crow:
              - 'lambdas/murder/**'
              - 'lambdas/worker/**'
            email_templates:
              - 'lambdas/custom-email-sender/templates/**'
            scripts:
              - 'scripts/**'
            docs_only:
              - 'docs/**'
              - '*.md'
              - '.gitignore'
              - 'LICENSE'

      - name: 📊 Determine Code Changes
        id: any-code
        run: |
          if [[ "${{ steps.changes.outputs.infrastructure }}" == "true" ||
                "${{ steps.changes.outputs.api }}" == "true" ||
                "${{ steps.changes.outputs.auth_lambdas }}" == "true" ||
                "${{ steps.changes.outputs.murder_crow }}" == "true" ||
                "${{ steps.changes.outputs.email_templates }}" == "true" ||
                "${{ steps.changes.outputs.scripts }}" == "true" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
            echo "::notice::📝 Code changes detected - deployment pipeline will run"
          else
            echo "result=false" >> $GITHUB_OUTPUT
            echo "::notice::📚 Only documentation changes - skipping deployment"
          fi

      - name: 📋 Change Summary
        run: |
          echo "## 🔍 Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed | Deployment Impact |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Infrastructure | ${{ steps.changes.outputs.infrastructure }} | Full CDK deployment |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 API Application | ${{ steps.changes.outputs.api }} | Lambda function update |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Auth Lambdas | ${{ steps.changes.outputs.auth_lambdas }} | Auth function update |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Murder/Crow | ${{ steps.changes.outputs.murder_crow }} | AI system update |" >> $GITHUB_STEP_SUMMARY
          echo "| 📧 Email Templates | ${{ steps.changes.outputs.email_templates }} | Email template update |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 iOS App | ${{ steps.changes.outputs.ios }} | Config update only |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 Documentation | ${{ steps.changes.outputs.docs_only }} | No deployment |" >> $GITHUB_STEP_SUMMARY

  # ================================
  # QUALITY GATE - Always runs for code changes
  # ================================
  python-quality:
    name: 🐍 Python Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_code == 'true'
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 💾 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: 🔍 MyPy Type Checking
        working-directory: apps/api
        run: |
          echo "::group::MyPy Type Checking"
          mypy src --strict --show-error-codes --pretty
          echo "::endgroup::"

      - name: 🎨 Code Formatting Check
        working-directory: apps/api
        run: |
          echo "::group::Black & isort"
          black src tests --check --line-length=88
          isort src tests --check-only --profile black
          echo "::endgroup::"

      - name: 🔍 Linting
        working-directory: apps/api
        run: |
          echo "::group::Flake8 & Bandit"
          flake8 src --max-line-length=88 --max-complexity=10
          bandit -r src -f json -o bandit-report.json
          echo "::endgroup::"

      - name: 🧪 Tests with Coverage
        working-directory: apps/api
        run: |
          echo "::group::Tests & Coverage"
          pytest --cov=src --cov-report=term-missing --cov-fail-under=80
          echo "::endgroup::"

  typescript-quality:
    name: ⚡ TypeScript Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript Type Checking
        run: |
          echo "::group::TypeScript Type Checking"
          npm run type-check:all
          echo "::endgroup::"

      - name: 🔍 ESLint
        run: |
          echo "::group::ESLint Zero Warnings"
          npm run quality:typescript
          echo "::endgroup::"

      - name: 📝 Prettier Formatting Check
        run: |
          echo "::group::Prettier Formatting"
          npm run format:check
          echo "::endgroup::"

  # ================================
  # FAST DEPLOYMENTS - Component-specific
  # ================================

  deploy-api-only:
    name: 🐍 Fast API Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, python-quality]
    if: |
      needs.detect-changes.outputs.api == 'true' &&
      needs.detect-changes.outputs.infrastructure == 'false' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: development
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🏗️ Build API Package
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          make build-lambda

      - name: 🚀 Deploy API Lambda
        working-directory: apps/api
        run: |
          echo "::group::Fast Lambda Update"
          aws lambda update-function-code \
            --function-name cawnex-api-dev \
            --zip-file fileb://dist/api.zip \
            --publish
          echo "::endgroup::"

      - name: ✅ Fast Deployment Summary
        run: |
          echo "## ⚡ Fast API Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **API updated in ~2 minutes** (vs 20 min full deployment)" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **90% time savings** achieved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **What was deployed:**" >> $GITHUB_STEP_SUMMARY
          echo "- API Lambda function code updated" >> $GITHUB_STEP_SUMMARY
          echo "- No infrastructure changes" >> $GITHUB_STEP_SUMMARY
          echo "- No iOS config changes needed" >> $GITHUB_STEP_SUMMARY

  deploy-auth-only:
    name: 🔐 Fast Auth Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, python-quality]
    if: |
      needs.detect-changes.outputs.auth_lambdas == 'true' &&
      needs.detect-changes.outputs.infrastructure == 'false' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: development
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🔐 Deploy Auth Functions
        run: |
          echo "::group::Auth Lambda Updates"
          # Update post-confirmation Lambda if changed
          if [[ -n $(git diff HEAD~1 HEAD --name-only | grep "lambdas/auth-post-confirmation") ]]; then
            cd lambdas/auth-post-confirmation
            zip -r function.zip . -x "*.git*" "*.DS_Store*"
            aws lambda update-function-code \
              --function-name cawnex-post-confirmation-dev \
              --zip-file fileb://function.zip
            cd ../..
            echo "✅ Post-confirmation Lambda updated"
          fi

          # Update custom email sender if changed
          if [[ -n $(git diff HEAD~1 HEAD --name-only | grep "lambdas/custom-email-sender") ]]; then
            cd lambdas/custom-email-sender
            zip -r function.zip . -x "*.git*" "*.DS_Store*"
            aws lambda update-function-code \
              --function-name cawnex-custom-email-sender-dev \
              --zip-file fileb://function.zip
            cd ../..
            echo "✅ Custom email sender Lambda updated"
          fi
          echo "::endgroup::"

      - name: ✅ Auth Deployment Summary
        run: |
          echo "## 🔐 Fast Auth Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Auth system updated in ~3 minutes**" >> $GITHUB_STEP_SUMMARY
          echo "📧 **Email templates and auth logic deployed**" >> $GITHUB_STEP_SUMMARY

  deploy-murder-crow-only:
    name: 🤖 Fast Murder/Crow Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, python-quality]
    if: |
      needs.detect-changes.outputs.murder_crow == 'true' &&
      needs.detect-changes.outputs.infrastructure == 'false' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: development
    timeout-minutes: 8
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🤖 Deploy Murder/Crow System
        run: |
          echo "::group::Murder/Crow Lambda Updates"
          # Update Murder Lambda if changed
          if [[ -n $(git diff HEAD~1 HEAD --name-only | grep "lambdas/murder") ]]; then
            cd lambdas/murder
            # Install dependencies and package
            python -m pip install --upgrade pip
            pip install -r requirements.txt -t package/
            cp -r src/* package/
            cd package && zip -r ../function.zip . && cd ..

            aws lambda update-function-code \
              --function-name cawnex-murder-dev \
              --zip-file fileb://function.zip
            cd ../..
            echo "✅ Murder Lambda updated"
          fi

          # Update Worker Lambda if changed
          if [[ -n $(git diff HEAD~1 HEAD --name-only | grep "lambdas/worker") ]]; then
            cd lambdas/worker
            # Install dependencies and package
            python -m pip install --upgrade pip
            pip install -r requirements.txt -t package/
            cp -r src/* package/
            cd package && zip -r ../function.zip . && cd ..

            aws lambda update-function-code \
              --function-name cawnex-worker-dev \
              --zip-file fileb://function.zip
            cd ../..
            echo "✅ Worker Lambda updated"
          fi
          echo "::endgroup::"

      - name: ✅ Murder/Crow Deployment Summary
        run: |
          echo "## 🤖 Fast Murder/Crow Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Autonomous development system updated**" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **AI agents ready with latest code**" >> $GITHUB_STEP_SUMMARY

  # ================================
  # FULL INFRASTRUCTURE DEPLOYMENT
  # ================================
  deploy-infrastructure:
    name: 🏗️ Full Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, python-quality, typescript-quality]
    if: |
      (needs.detect-changes.outputs.infrastructure == 'true' ||
       github.event.inputs.force_infrastructure == 'true') &&
      github.ref == 'refs/heads/main'
    environment: development
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 💾 Cache CDK Assets
        uses: actions/cache@v5
        with:
          path: |
            infra/cdk.out
            infra/node_modules
          key: ${{ runner.os }}-cdk-${{ hashFiles('infra/package-lock.json', 'infra/cdk.json') }}
          restore-keys: |
            ${{ runner.os }}-cdk-

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          make build-lambda

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 📋 CDK Diff Analysis
        working-directory: infra
        run: |
          echo "::group::CDK Diff Analysis"
          npm ci
          npx cdk diff --context stage=dev > cdk-diff.txt || true

          if grep -q "There were no differences" cdk-diff.txt; then
            echo "SKIP_DEPLOYMENT=true" >> $GITHUB_ENV
            echo "::notice::🎯 No infrastructure changes detected - skipping deployment"
          else
            echo "SKIP_DEPLOYMENT=false" >> $GITHUB_ENV
            echo "::notice::🏗️ Infrastructure changes detected:"
            cat cdk-diff.txt
          fi
          echo "::endgroup::"

      - name: 🏗️ Deploy Infrastructure
        if: env.SKIP_DEPLOYMENT == 'false' || github.event.inputs.force_infrastructure == 'true'
        working-directory: infra
        run: |
          echo "::group::CDK Bootstrap & Deploy"
          npx cdk bootstrap --context stage=dev
          npx cdk deploy --all --context stage=dev --require-approval never
          echo "::endgroup::"

      - name: 📱 Update iOS Configuration
        if: env.SKIP_DEPLOYMENT == 'false' || github.event.inputs.force_infrastructure == 'true'
        run: |
          chmod +x scripts/update-ios-config.sh

          # Extract outputs from deployed CloudFormation stacks
          AUTH_STACK_NAME="CawnexAuthStack-dev"
          MAIN_STACK_NAME="Cawnex-dev"

          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name $AUTH_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
            --output text)

          IOS_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name $AUTH_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`iOSClientId`].OutputValue' \
            --output text)

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name $MAIN_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontUrl`].OutputValue' \
            --output text)

          # Set environment variables for script
          export CAWNEX_USER_POOL_ID="$USER_POOL_ID"
          export CAWNEX_IOS_CLIENT_ID="$IOS_CLIENT_ID"
          export CAWNEX_API_URL="$API_URL"

          ./scripts/update-ios-config.sh dev --from-env

      - name: 📊 Infrastructure Deployment Summary
        run: |
          if [ "${{ env.SKIP_DEPLOYMENT }}" == "true" ]; then
            echo "## 🎯 Smart Infrastructure Skip!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **No infrastructure changes detected**" >> $GITHUB_STEP_SUMMARY
            echo "⚡ **Deployment time saved: ~20 minutes**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🏗️ Infrastructure Deployment Complete!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Full CDK deployment successful**" >> $GITHUB_STEP_SUMMARY
            echo "📱 **iOS configuration updated**" >> $GITHUB_STEP_SUMMARY
            echo "🔧 **All services running latest infrastructure**" >> $GITHUB_STEP_SUMMARY
          fi

  # ================================
  # DEPLOYMENT SUMMARY
  # ================================
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        deploy-api-only,
        deploy-auth-only,
        deploy-murder-crow-only,
        deploy-infrastructure,
      ]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: 📊 Generate Smart Deployment Report
        run: |
          echo "## 🚀 Smart Deployment Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Calculate time savings
          TOTAL_SAVINGS=0

          if [ "${{ needs.deploy-api-only.result }}" == "success" ]; then
            echo "✅ **Fast API Deployment** - Completed in ~2 minutes (90% time savings)" >> $GITHUB_STEP_SUMMARY
            TOTAL_SAVINGS=$((TOTAL_SAVINGS + 18))
          fi

          if [ "${{ needs.deploy-auth-only.result }}" == "success" ]; then
            echo "✅ **Fast Auth Deployment** - Completed in ~3 minutes (85% time savings)" >> $GITHUB_STEP_SUMMARY
            TOTAL_SAVINGS=$((TOTAL_SAVINGS + 17))
          fi

          if [ "${{ needs.deploy-murder-crow-only.result }}" == "success" ]; then
            echo "✅ **Fast Murder/Crow Deployment** - Completed in ~5 minutes (75% time savings)" >> $GITHUB_STEP_SUMMARY
            TOTAL_SAVINGS=$((TOTAL_SAVINGS + 15))
          fi

          if [ "${{ needs.deploy-infrastructure.result }}" == "success" ]; then
            echo "✅ **Infrastructure Deployment** - Full deployment when needed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.detect-changes.outputs.docs_only }}" == "true" ]; then
            echo "📚 **Documentation Only** - No deployment needed (100% time savings)" >> $GITHUB_STEP_SUMMARY
            TOTAL_SAVINGS=20
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ **Total Time Saved:** ~${TOTAL_SAVINGS} minutes" >> $GITHUB_STEP_SUMMARY
          echo "💰 **GitHub Actions Minutes Saved:** ${TOTAL_SAVINGS}" >> $GITHUB_STEP_SUMMARY
          echo "⚡ **Developer Experience:** Much faster feedback loop!" >> $GITHUB_STEP_SUMMARY
