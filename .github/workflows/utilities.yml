name: 🔧 Utilities & Manual Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform"
        required: true
        default: "update-ios-config"
        type: choice
        options:
          - setup-aws-secrets
          - update-ios-config
          - ios-quality-check
          - destroy-stacks
          - deploy-staging
          - deploy-production
      stage:
        description: "Target stage (for setup-aws-secrets)"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup-aws-secrets:
    name: 🔐 Setup AWS Secrets Manager
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'setup-aws-secrets'
    steps:
      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🔐 Create/Update Secrets in AWS Secrets Manager
        env:
          STAGE: ${{ github.event.inputs.stage }}
          GH_PAT_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          ANTHROPIC_TOKEN: ${{ secrets.WORKER_ANTHROPIC_AUTH_TOKEN }}
        run: |
          echo "🔐 Setting up secrets for stage: $STAGE"

          # GitHub PAT for Worker git operations
          if [ -z "$GH_PAT_TOKEN" ]; then
            echo "::error::WORKER_GITHUB_TOKEN secret is not set in GitHub Secrets"
            exit 1
          fi

          aws secretsmanager create-secret \
            --name "cawnex/${STAGE}/github-token" \
            --secret-string "$GH_PAT_TOKEN" \
            --description "GitHub PAT for Worker git clone/push" \
            2>/dev/null || \
          aws secretsmanager update-secret \
            --secret-id "cawnex/${STAGE}/github-token" \
            --secret-string "$GH_PAT_TOKEN"

          echo "✅ cawnex/${STAGE}/github-token created/updated"

          # Anthropic OAuth token for Worker Claude calls
          if [ -z "$ANTHROPIC_TOKEN" ]; then
            echo "::error::WORKER_ANTHROPIC_AUTH_TOKEN secret is not set in GitHub Secrets"
            exit 1
          fi

          aws secretsmanager create-secret \
            --name "cawnex/${STAGE}/anthropic-auth-token" \
            --secret-string "$ANTHROPIC_TOKEN" \
            --description "Anthropic OAuth token for Worker Claude calls" \
            2>/dev/null || \
          aws secretsmanager update-secret \
            --secret-id "cawnex/${STAGE}/anthropic-auth-token" \
            --secret-string "$ANTHROPIC_TOKEN"

          echo "✅ cawnex/${STAGE}/anthropic-auth-token created/updated"

      - name: 📊 Summary
        env:
          STAGE: ${{ github.event.inputs.stage }}
        run: |
          echo "## 🔐 AWS Secrets Manager Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stage:** $STAGE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`cawnex/$STAGE/github-token\` | ✅ Created/Updated |" >> $GITHUB_STEP_SUMMARY
          echo "| \`cawnex/$STAGE/anthropic-auth-token\` | ✅ Created/Updated |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** GitHub Secrets \`WORKER_GITHUB_TOKEN\` and \`WORKER_ANTHROPIC_AUTH_TOKEN\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Next:** Run \`deploy-dev\` via the main pipeline or utilities workflow" >> $GITHUB_STEP_SUMMARY

  update-ios-config:
    name: 📱 Update iOS Configuration
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'update-ios-config'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 📱 Update iOS Configuration from AWS
        run: |
          chmod +x scripts/update-ios-config.sh
          ./scripts/update-ios-config.sh dev

      - name: 💾 Commit Updated Configuration
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add apps/ios/Cawnex/Cawnex/Core/Config/
          git commit -m "feat: update iOS configuration from deployed infrastructure" || echo "No changes to commit"
          git push

  ios-quality-check:
    name: 📱 iOS Quality Check (Manual Only)
    runs-on: macos-latest
    if: github.event.inputs.operation == 'ios-quality-check'
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: 🔍 Swift Build & Test
        working-directory: apps/ios/Cawnex
        run: |
          echo "::group::Swift Build & Quality Check"
          echo "💰 Note: This uses expensive macOS runners - run only when needed"

          # List available simulators for debugging
          xcrun simctl list devices available

          # Build with any available iOS simulator
          xcodebuild clean build \
            -scheme Cawnex \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            OTHER_SWIFT_FLAGS="-warnings-as-errors" || \
          xcodebuild clean build \
            -scheme Cawnex \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            OTHER_SWIFT_FLAGS="-warnings-as-errors"
          echo "::endgroup::"

          echo "✅ iOS quality check completed successfully"
          echo "💡 Tip: Only run this when iOS code changes to save costs"

  destroy-stacks:
    name: 🗑️ Destroy AWS Stacks
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'destroy-stacks'
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🗑️ Destroy Stacks
        working-directory: infra
        run: |
          npm ci
          echo "⚠️ WARNING: This will destroy ALL AWS resources!"
          echo "Destroying in 10 seconds... (Cancel with Ctrl+C if needed)"
          sleep 10
          npx cdk destroy --all --force

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'deploy-staging'
    environment: staging
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          make build-lambda

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🏗️ Deploy to Staging
        working-directory: infra
        run: |
          npm ci
          npx cdk bootstrap --context stage=staging
          npx cdk deploy --all --context stage=staging --require-approval never

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.operation == 'deploy-production'
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          make build-lambda

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: 🚀 Deploy to Production
        working-directory: infra
        run: |
          npm ci
          npx cdk bootstrap --context stage=production
          npx cdk deploy --all --context stage=production --require-approval never
