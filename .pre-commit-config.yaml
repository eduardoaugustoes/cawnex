# Pre-commit Hooks - Match CI Pipeline EXACTLY
repos:
  # ================================
  # GENERAL CODE QUALITY
  # ================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ================================
  # PYTHON QUALITY - EXACT CI MATCH
  # ================================
  - repo: local
    hooks:
      # MyPy - exact command from CI
      - id: mypy-strict
        name: mypy src --strict --show-error-codes
        entry: bash -c 'cd apps/api && source venv/bin/activate && mypy src --strict --show-error-codes'
        language: system
        files: ^apps/api/src/.*\.py$
        require_serial: true

      # Black - exact command from CI
      - id: black-check
        name: black src tests --check --line-length=88
        entry: bash -c 'cd apps/api && source venv/bin/activate && black src tests --check --line-length=88'
        language: system
        files: ^apps/api/(src|tests)/.*\.py$
        require_serial: true

      # Flake8 - exact command from CI
      - id: flake8-check
        name: flake8 src --max-line-length=88 --max-complexity=10
        entry: bash -c 'cd apps/api && source venv/bin/activate && flake8 src --max-line-length=88 --max-complexity=10'
        language: system
        files: ^apps/api/src/.*\.py$
        require_serial: true

      # Pytest - exact command from CI (temporarily lowered to 75% coverage)
      - id: pytest-coverage
        name: pytest --cov=src --cov-report=term-missing --cov-fail-under=75
        entry: bash -c 'cd apps/api && source venv/bin/activate && pytest --cov=src --cov-report=term-missing --cov-fail-under=75'
        language: system
        files: ^apps/api/(src|tests)/.*\.py$
        require_serial: true
        pass_filenames: false

  # ================================
  # TYPESCRIPT/DOCS QUALITY
  # ================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|js|json|md|yml|yaml)$
        exclude: node_modules/

  # ================================
  # PYTHON FORMATTING AUTO-FIX
  # ================================
  - repo: local
    hooks:
      # Black auto-fix (runs after checks fail)
      - id: black-fix
        name: black src tests --line-length=88 (auto-fix)
        entry: bash -c 'cd apps/api && source venv/bin/activate && black src tests --line-length=88'
        language: system
        files: ^apps/api/(src|tests)/.*\.py$
        require_serial: true
        stages: [manual]

      # isort auto-fix
      - id: isort-fix
        name: isort src tests (auto-fix)
        entry: bash -c 'cd apps/api && source venv/bin/activate && isort src tests'
        language: system
        files: ^apps/api/(src|tests)/.*\.py$
        require_serial: true
        stages: [manual]
