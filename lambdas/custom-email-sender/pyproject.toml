[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-email-sender"
version = "0.1.0"
description = "Custom Email Sender Lambda — branded Cognito emails via SES"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools]
py-modules = ["handler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
