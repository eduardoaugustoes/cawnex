# gitleaks.toml — DayOne AI baseline secret-scanning config
# Extends gitleaks default ruleset with org-specific allowlists.
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "dayone-ai gitleaks config"

[extend]
# Use the upstream default rules as the base.
useDefault = true

# ---------------------------------------------------------------------------
# Org-specific additional rules
# ---------------------------------------------------------------------------

[[rules]]
id          = "paperclip-api-key"
description = "Possible Paperclip API key"
regex       = '''(?i)paperclip[_\-.]?(api[_\-.]?)?key[\"']?\s*[:=]\s*[\"']?([A-Za-z0-9_\-]{32,})'''
tags        = ["paperclip", "api-key"]

  [rules.allowlist]
  description = "Known safe patterns in config templates"
  regexes     = ['''<YOUR_KEY_HERE>''', '''PAPERCLIP_API_KEY_PLACEHOLDER''']

[[rules]]
id          = "anthropic-api-key"
description = "Anthropic / Claude API key"
regex       = '''sk-ant-[A-Za-z0-9_\-]{32,}'''
tags        = ["anthropic", "api-key"]

# ---------------------------------------------------------------------------
# Global allowlist
# ---------------------------------------------------------------------------

[allowlist]
description = "Global allowlist for this repo"

# Test fixture files that intentionally contain fake secret patterns.
paths = [
  '''test/fixtures/.*''',
  '''\.gitleaks\.toml$''',
]

# Commits that seeded test data (synthetic bad-case demos).
# Add commit SHAs here after the acceptance-test run.
commits = []

# Regex patterns that are always safe to ignore across all rules.
regexes = [
  # Placeholder values used in documentation
  '''<YOUR_.*_HERE>''',
  '''example\.com''',
  '''localhost''',
]
